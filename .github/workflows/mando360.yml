name: Compilar con mando 360

on:
  workflow_dispatch:
    inputs:
      usb_hid:
        description: "USB_HID: 0 = con mando 360 (como revvv), 1 = modo normal (sin mando 360, para probar el HDD)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar los cambios del mando de revvv
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI"
          git remote add revvv https://github.com/revvv/Nintendont-XBOX360.git
          git fetch revvv master
          git diff HEAD...revvv/master -- kernel/HID.c kernel/HID.h controllerconfigs/045e_028e.ini > parte1.patch
          git diff HEAD...revvv/master -- loader/source/ppc/PADReadGC/source/PADReadGC.c > parte2.patch
          git apply --3way --whitespace=nowarn parte1.patch
          git apply --3way --whitespace=nowarn parte2.patch || echo "Hay conflictos en PADReadGC.c, se resuelven abajo"
          python3 - <<'EOF'
          import re
          p = 'loader/source/ppc/PADReadGC/source/PADReadGC.c'
          s = open(p, newline='').read()
          n = len(re.findall(r'<<<<<<< ours', s))
          s = re.sub(r'<<<<<<< ours\r?\n.*?=======\r?\n(.*?)>>>>>>> theirs\r?\n', r'\1', s, flags=re.S)
          open(p, 'w', newline='').write(s)
          print('Conflictos resueltos con la version de revvv:', n)
          EOF
          if grep -q '<<<<<<<\|>>>>>>>' loader/source/ppc/PADReadGC/source/PADReadGC.c; then
            echo "TODAVIA HAY MARCAS DE CONFLICTO"
            exit 1
          fi

      - name: Elegir el modo USB
        run: |
          sed -i 's/^#define USB_HID .*/#define USB_HID ${{ inputs.usb_hid }}/' kernel/HID.c
          grep -n "define USB_HID" kernel/HID.c

      - name: Compilar
        run: |
          docker run --rm --volume="$PWD":/work --workdir=/work henriquegemignani/docker-devkitpro-nintendont bash -c "chmod +x Build.sh && ./Build.sh"

      - name: Guardar el resultado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nintendont-usbhid${{ inputs.usb_hid }}
          path: |
            **/*.dol
            controllerconfigs/045e_028e.ini
