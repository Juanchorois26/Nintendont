name: Compilar Nintendont

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: henriquegemignani/docker-devkitpro-nintendont
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Compilar
        run: |
          chmod +x Build.sh
          ./Build.sh

      - name: Guardar el resultado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nintendont-build
          path: |
            loader/loader.dol
            **/*.dol
